spring.application.name=eventhub-backend
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventhub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=Vicky@2006

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
